<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0F380F"/>
      <rect x="0" y="0" width="4" height="4" fill="#306230" opacity="0.35"/>
      <rect x="4" y="4" width="4" height="4" fill="#306230" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#dots)"/>
  <rect x="20" y="16" width="860" height="188" rx="6" fill="#306230" stroke="#9BBC0F" stroke-width="4"/>

  <!-- Game Boy body -->
  <rect x="40" y="36" width="280" height="148" rx="18" fill="#8BAC0F" stroke="#0F380F" stroke-width="4"/>
  <rect x="56" y="52" width="248" height="116" rx="4" fill="#0F380F" stroke="#306230" stroke-width="3"/>

  <!-- Screen content: mini tetris blocks -->
  <g fill="#9BBC0F">
    <rect x="72" y="68" width="20" height="20"/><rect x="92" y="68" width="20" height="20"/><rect x="112" y="68" width="20" height="20"/><rect x="132" y="68" width="20" height="20"/>
    <rect x="92" y="88" width="20" height="20"/><rect x="112" y="88" width="20" height="20"/>
    <rect x="112" y="108" width="20" height="20"/><rect x="132" y="108" width="20" height="20"/><rect x="152" y="108" width="20" height="20"/>
    <rect x="72" y="128" width="20" height="20"/><rect x="92" y="128" width="20" height="20"/><rect x="112" y="128" width="20" height="20"/>
    <rect x="152" y="68" width="20" height="20"/><rect x="172" y="68" width="20" height="20"/><rect x="172" y="88" width="20" height="20"/><rect x="192" y="88" width="20" height="20"/>
    <rect x="192" y="108" width="20" height="20"/><rect x="212" y="108" width="20" height="20"/><rect x="232" y="108" width="20" height="20"/><rect x="212" y="128" width="20" height="20"/>
  </g>
  <g fill="#8BAC0F" opacity="0.7">
    <rect x="232" y="68" width="20" height="20"/><rect x="252" y="68" width="20" height="20"/><rect x="252" y="88" width="20" height="20"/><rect x="272" y="88" width="20" height="20"/>
  </g>

  <!-- D-pad -->
  <rect x="78" y="178" width="14" height="42" fill="#0F380F"/>
  <rect x="64" y="192" width="42" height="14" fill="#0F380F"/>
  <!-- A/B buttons -->
  <circle cx="248" cy="188" r="10" fill="#0F380F"/>
  <circle cx="278" cy="178" r="10" fill="#0F380F"/>
  <text x="248" y="192" font-family="monospace" font-size="8" fill="#9BBC0F" text-anchor="middle">B</text>
  <text x="278" y="182" font-family="monospace" font-size="8" fill="#9BBC0F" text-anchor="middle">A</text>

  <!-- Title area -->
  <text x="360" y="72" font-family="monospace" font-size="14" fill="#8BAC0F" letter-spacing="3">▶ PLAYER 1 START</text>
  <text x="360" y="118" font-family="monospace" font-size="36" font-weight="bold" fill="#9BBC0F" letter-spacing="2">TEGUH JANUAR</text>
  <text x="360" y="158" font-family="monospace" font-size="36" font-weight="bold" fill="#9BBC0F" letter-spacing="2">RIFALDI</text>
  <text x="360" y="188" font-family="monospace" font-size="16" fill="#8BAC0F">NEWBIE WEB DEV  "  INSERT COIN TO CONNECT</text>

  <!-- Decorative tetrominoes -->
  <g fill="#9BBC0F" opacity="0.9">
    <rect x="780" y="48" width="18" height="18"/><rect x="798" y="48" width="18" height="18"/><rect x="816" y="48" width="18" height="18"/><rect x="834" y="48" width="18" height="18"/>
    <rect x="798" y="66" width="18" height="18"/><rect x="816" y="66" width="18" height="18"/>
    <rect x="760" y="100" width="18" height="18"/><rect x="778" y="100" width="18" height="18"/><rect x="778" y="118" width="18" height="18"/><rect x="796" y="118" width="18" height="18"/>
    <rect x="830" y="100" width="18" height="18"/><rect x="848" y="100" width="18" height="18"/><rect x="848" y="118" width="18" height="18"/><rect x="866" y="118" width="18" height="18"/>
  </g>

  <!-- Blinking cursor -->
  <rect x="700" y="172" width="14" height="22" fill="#9BBC0F">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
