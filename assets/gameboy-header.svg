<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200">
  <!-- Background -->
  <rect width="840" height="200" rx="8" fill="#0D1117"/>
  <rect x="1" y="1" width="838" height="198" rx="7" fill="none" stroke="#306230" stroke-width="2"/>

  <!-- Game Boy body -->
  <rect x="32" y="24" width="160" height="152" rx="12" fill="#C8C8C8" stroke="#A0A0A0" stroke-width="2"/>
  <rect x="32" y="24" width="160" height="152" rx="12" fill="#B8B89A" stroke="#8B8B6E" stroke-width="2"/>

  <!-- Screen bezel -->
  <rect x="48" y="36" width="128" height="96" rx="4" fill="#4A5028"/>
  <!-- Screen -->
  <rect x="54" y="42" width="116" height="84" rx="2" fill="#9BBC0F"/>

  <!-- Pixel art on screen - simple space invader -->
  <g fill="#0F380F">
    <rect x="78" y="52" width="8" height="8"/>
    <rect x="102" y="52" width="8" height="8"/>
    <rect x="70" y="60" width="8" height="8"/>
    <rect x="78" y="60" width="8" height="8"/>
    <rect x="86" y="60" width="8" height="8"/>
    <rect x="94" y="60" width="8" height="8"/>
    <rect x="102" y="60" width="8" height="8"/>
    <rect x="110" y="60" width="8" height="8"/>
    <rect x="62" y="68" width="8" height="8"/>
    <rect x="70" y="68" width="8" height="8"/>
    <rect x="78" y="68" width="8" height="8"/>
    <rect x="86" y="68" width="8" height="8"/>
    <rect x="94" y="68" width="8" height="8"/>
    <rect x="102" y="68" width="8" height="8"/>
    <rect x="110" y="68" width="8" height="8"/>
    <rect x="118" y="68" width="8" height="8"/>
    <rect x="62" y="76" width="8" height="8"/>
    <rect x="78" y="76" width="8" height="8"/>
    <rect x="86" y="76" width="8" height="8"/>
    <rect x="94" y="76" width="8" height="8"/>
    <rect x="102" y="76" width="8" height="8"/>
    <rect x="118" y="76" width="8" height="8"/>
    <rect x="62" y="84" width="8" height="8"/>
    <rect x="118" y="84" width="8" height="8"/>
    <rect x="70" y="92" width="8" height="8"/>
    <rect x="86" y="92" width="8" height="8"/>
    <rect x="94" y="92" width="8" height="8"/>
    <rect x="110" y="92" width="8" height="8"/>
  </g>

  <!-- SCORE text on screen -->
  <text x="112" y="118" font-family="monospace" font-size="9" fill="#0F380F" text-anchor="middle" font-weight="bold">HI-SCORE: 9999</text>

  <!-- Screen power indicator -->
  <circle cx="52" cy="136" r="3" fill="#9BBC0F"/>
  <text x="60" y="139" font-family="monospace" font-size="7" fill="#8B8B6E">POWER</text>

  <!-- D-pad -->
  <rect x="56" y="147" width="10" height="26" rx="1" fill="#2D2D2D"/>
  <rect x="48" y="155" width="26" height="10" rx="1" fill="#2D2D2D"/>

  <!-- A B buttons -->
  <circle cx="152" cy="148" r="8" fill="#8B2252"/>
  <circle cx="172" cy="140" r="8" fill="#8B2252"/>
  <text x="152" y="152" font-family="monospace" font-size="7" fill="#C8C8C8" text-anchor="middle">A</text>
  <text x="172" y="144" font-family="monospace" font-size="7" fill="#C8C8C8" text-anchor="middle">B</text>

  <!-- Start/Select -->
  <rect x="80" y="166" width="20" height="5" rx="2" fill="#8B8B6E" transform="rotate(-25, 90, 168)"/>
  <rect x="108" y="166" width="20" height="5" rx="2" fill="#8B8B6E" transform="rotate(-25, 118, 168)"/>

  <!-- Right side: Name and info -->
  <text x="240" y="68" font-family="'Courier New', monospace" font-size="12" fill="#8BAC0F" letter-spacing="4">PLAYER 1</text>

  <text x="240" y="105" font-family="'Courier New', monospace" font-size="30" fill="#E6EDF3" font-weight="bold" letter-spacing="1">TEGUH JANUAR</text>
  <text x="240" y="140" font-family="'Courier New', monospace" font-size="30" fill="#E6EDF3" font-weight="bold" letter-spacing="1">RIFALDI</text>

  <text x="240" y="172" font-family="'Courier New', monospace" font-size="13" fill="#8B949E">Web Developer  //  Front-End  //  4 yrs exp</text>

  <!-- Decorative dots on right -->
  <g fill="#306230" opacity="0.4">
    <rect x="760" y="30" width="4" height="4"/>
    <rect x="770" y="30" width="4" height="4"/>
    <rect x="780" y="30" width="4" height="4"/>
    <rect x="770" y="40" width="4" height="4"/>
    <rect x="780" y="40" width="4" height="4"/>
    <rect x="780" y="50" width="4" height="4"/>

    <rect x="760" y="150" width="4" height="4"/>
    <rect x="770" y="150" width="4" height="4"/>
    <rect x="780" y="150" width="4" height="4"/>
    <rect x="760" y="160" width="4" height="4"/>
    <rect x="770" y="160" width="4" height="4"/>
    <rect x="760" y="170" width="4" height="4"/>
  </g>
</svg>
